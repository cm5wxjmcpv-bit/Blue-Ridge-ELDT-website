<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hazmat Payment Complete | Blue Ridge ELDT</title>
  <script src="config.js" defer></script>
  <script src="frontend-api.js" defer></script>
  <style>
    :root{--navy:#17324d;--navy2:#10263a;--green:#2f8f4e;--bg:#eef2f6;--muted:#5b6570;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#1f2937}
    .top{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;border-bottom:4px solid var(--green);padding:18px 20px}.top div{max-width:780px;margin:auto;font-weight:900}
    .page{max-width:780px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 14px 38px rgba(16,38,58,.12);text-align:center}
    .icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#e8f5ec;color:var(--green);font-size:36px;font-weight:950}
    h1{color:var(--navy2);margin:0 0 10px}.status{color:var(--muted);line-height:1.6;margin:0 auto 20px;max-width:570px}.btn{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 20px;border-radius:13px;background:linear-gradient(135deg,var(--green),#23743e);color:#fff;text-decoration:none;font-weight:900}
    .secondary{background:#edf2f7;color:var(--navy2);margin-left:8px}.error{color:var(--danger)}.spinner{width:28px;height:28px;border:4px solid #d9e3ec;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:18px auto}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header class="top"><div>Blue Ridge Entry Level Driver Training</div></header>
  <main class="page">
    <section class="card">
      <div class="icon" id="icon">✓</div>
      <h1 id="title">Finalizing your Hazmat enrollment</h1>
      <div class="spinner" id="spinner"></div>
      <p class="status" id="status">We are confirming your Square payment and activating your training account.</p>
      <div id="actions" hidden>
        <a class="btn" href="index.html">Sign In & Start Training</a>
        <a class="btn secondary" href="hazmat.html">Course Page</a>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded",async()=>{
      const params=new URLSearchParams(location.search);
      const enrollmentId=params.get("enrollmentId")||sessionStorage.getItem("hazmatEnrollmentId")||"";
      const title=document.getElementById("title");
      const status=document.getElementById("status");
      const spinner=document.getElementById("spinner");
      const actions=document.getElementById("actions");
      const icon=document.getElementById("icon");

      if(!enrollmentId){
        spinner.hidden=true;icon.textContent="!";title.textContent="Enrollment could not be identified";status.className="status error";status.textContent="Return to the Hazmat course page and use the enrollment flow again.";return;
      }

      for(let attempt=0;attempt<8;attempt++){
        try{
          const res=await apiVerifyHazmatPayment(enrollmentId);
          if(res&&res.ok&&res.paid&&res.active){
            spinner.hidden=true;icon.textContent="✓";title.textContent="Payment confirmed — your course is ready";
            status.textContent="Your Hazmat training account is active. Sign in with the username and password you created to begin the course.";
            actions.hidden=false;
            return;
          }
          if(res&&res.ok&&res.pending){
            status.textContent="Square is still finalizing the payment. We will check again automatically…";
          }else if(res&&!res.ok){
            throw new Error(res.error||"Unable to verify payment.");
          }
        }catch(err){
          console.error(err);
          if(attempt===7){
            spinner.hidden=true;icon.textContent="!";title.textContent="Payment verification is still pending";status.className="status error";
            status.textContent="If your Square payment completed, refresh this page in a moment. Your payment will not be charged again.";
            return;
          }
        }
        await new Promise(resolve=>setTimeout(resolve,2000));
      }

      spinner.hidden=true;icon.textContent="!";title.textContent="Payment verification is still pending";status.className="status error";
      status.textContent="If your Square payment completed, refresh this page in a moment. Your payment will not be charged again.";
    });
  </script>
</body>
</html>
